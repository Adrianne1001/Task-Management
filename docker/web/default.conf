# Single origin for the SPA and the API (PLAN.md Q16): the browser only ever talks to this server, so
# Sanctum's session/XSRF cookies are first-party and no CORS is involved.
#
#   /api/*, /sanctum/*  -> php-fpm (Laravel public/index.php in the "app" container)
#   everything else     -> the Angular build, falling back to index.html for client-side routes

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API only accepts small JSON bodies.
    client_max_body_size 1m;

    # Resolve the app container through Docker's DNS at request time (not once at startup), so restarting or
    # recreating "app" (new IP) does not leave nginx pointing at a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|sanctum)(/|$) {
        # Laravel sets its own security headers on these responses (SecurityHeaders middleware).
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # httpoxy mitigation.
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_pass $php_upstream;
    }

    # Hashed bundles (outputHashing: all) never change, so they can be cached forever.
    location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
        include /etc/nginx/snippets/spa-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/spa-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/spa-headers.conf;
        try_files $uri /index.html;
    }
}
