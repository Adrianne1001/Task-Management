# Security headers for the static SPA. Included per location (not at server level) so they are not duplicated
# on API responses, which Laravel already decorates.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Must keep sending the Referer on same-origin requests: Sanctum treats a request as stateful (session cookie
# auth) only when its Referer/Origin is in SANCTUM_STATEFUL_DOMAINS, and same-origin GETs carry no Origin header.
# "no-referrer" here would make every authenticated GET /api/* return 401.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No script-src: Angular's critical-CSS inlining uses an onload attribute on the stylesheet link, which a strict
# script-src would block (leaving the app unstyled). These directives are safe with the current build.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
