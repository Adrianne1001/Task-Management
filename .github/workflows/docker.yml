name: Docker

# Builds the Docker Compose stack and smoke-tests it end to end through nginx (SPA, CSRF cookie, login, API).

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Compose build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - name: Show Docker versions
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test
        run: bash docker/smoke-test.sh

      - name: Smoke test again after restarting the app (entrypoint must be re-runnable)
        run: |
          docker compose restart app
          docker compose up -d --wait --wait-timeout 120
          bash docker/smoke-test.sh

      - name: Dump container state and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
