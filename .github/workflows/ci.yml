name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: mbstring, xml, dom, ctype, fileinfo, tokenizer, bcmath, intl, curl, openssl, pdo, pdo_sqlite, sqlite3, pdo_mysql
  NODE_VERSION: '22'

jobs:
  backend-sqlite:
    name: Backend (Pint + tests, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      # phpunit.xml points the suite at in-memory SQLite.
      - name: Run tests
        run: php artisan test

  backend-mysql:
    name: Backend (tests + migrate/seed, MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        # Matches the MySQL 9.1 used in development (WAMP).
        image: mysql:9.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: cpt_app
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Real environment variables take precedence over .env and phpunit.xml's non-forced <env>.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: cpt_app
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Same layout as local development: an app DB and a separate test DB, least-privilege user.
      - name: Create databases
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot -e "
            CREATE DATABASE client_project_tracker CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE client_project_tracker_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON client_project_tracker.* TO 'cpt_app'@'%';
            GRANT ALL PRIVILEGES ON client_project_tracker_test.* TO 'cpt_app'@'%';"

      - name: Run tests
        run: php artisan test
        env:
          DB_DATABASE: client_project_tracker_test

      - name: Migrate and seed
        run: php artisan migrate:fresh --seed --force
        env:
          DB_DATABASE: client_project_tracker

      - name: Assert 12 seeded projects
        run: |
          count=$(docker exec ${{ job.services.mysql.id }} mysql -uroot -proot -N -B \
            -e "SELECT COUNT(*) FROM client_project_tracker.projects;" 2>/dev/null)
          echo "Seeded projects: $count"
          test "$count" = "12"

  frontend:
    name: Frontend (Prettier, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build

      # Advisories are published independently of our changes, so report them without failing the build.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
